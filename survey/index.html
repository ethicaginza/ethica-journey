5:["期待をはるかに超える、忘れられないイノベーティブのディナーでした。", "ここまで心を動かされるイノベーティブのコースは初めてです。", "最初の一皿から最後まで、驚きの連続のイノベーティブなディナーでした。", "ペルー料理をベースにしたイノベーティブのコースに、すっかり魅了されました。", "料理と物語がひとつになった、唯一無二のイノベーティブ体験でした。", "一皿ごとに時代をめぐるイノベーティブのディナーコースに、終始わくわくしました。", "想像していた以上に、完成度の高いイノベーティブでした。", "東京で食べてきたイノベーティブの中でも、間違いなく特別な一夜でした。", "五感すべてで楽しめるイノベーティブのディナーで、心から満たされました。", "期待して銀座に伺いましたが、そのはるか上をいくイノベーティブなディナーでした。"],

2:["正直に言うと、期待していたイノベーティブ体験とは違いました。","楽しみにしていたイノベーティブでしたが、残念ながら満足しきれませんでした。","イノベーティブのコースとして、期待とは大きく違う印象でした。","率直に言って、今回のイノベーティブ体験には満足できませんでした。","期待して伺ったイノベーティブでしたが、残念に感じる点が多くありました。","イノベーティブとしての魅力を、今回は十分に感じられませんでした。","残念ながら、心に残るイノベーティブ体験にはなりませんでした。","楽しみにしていた分、今回のイノベーティブのコースには落胆しました。","コンセプトには惹かれましたが、イノベーティブ体験としては物足りませんでした。","今回は、期待していたイノベーティブの水準に届いていないと感じました。"]},

5:["An unforgettable innovative dinner that far exceeded my expectations.", "I have never been so moved by an innovative tasting course.", "From the first plate to the last, this innovative dinner was full of surprises.", "I was completely captivated by this innovative course rooted in Peruvian cuisine.", "A one-of-a-kind innovative fine dining experience where food and story become one.", "An innovative course that travels through the eras plate by plate — I was excited throughout.", "The innovative cuisine was far more accomplished than I had imagined.", "Of all the innovative restaurants I have tried in Tokyo, this was truly a special night.", "An innovative dinner that engages all five senses — I left completely satisfied.", "I came with high hopes, and this innovative fine dining experience went far beyond them."],

2:["To be honest, this was not the innovative experience I had hoped for.","I was looking forward to this innovative restaurant, but unfortunately left unsatisfied.","As an innovative course, it felt very different from what I expected.","Frankly, I was not satisfied with this innovative experience.","I came with high expectations for the innovative cuisine, but much of it disappointed me.","This time, I could not fully feel the appeal of the innovative cuisine.","Unfortunately, it did not become a memorable innovative experience.","Because I had looked forward to it, this innovative course was a letdown.","The concept drew me in, but the innovative experience itself fell short.","This time, it did not reach the level I expect from an innovative restaurant."]}};

S.postHTML = generate();
var text = plain(S.postHTML).trim();
S.payload = {
id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
lang:S.lang, stars:S.stars,
good:S.good.map(function(t){ return TERMS[t].ja; }).join("・"), goodDetail:detailText("good"),
bad:S.bad.map(function(t){ return TERMS[t].ja; }).join("・"), badDetail:detailText("bad"),
generated:text, final:text, edited:false,
name:refs.name.value.trim().slice(0, 40), consent:refs.consent.checked, page:location.href.split("?")[0], qr:QR,
scene:S.scenes.map(function(id){ var x = SCENES.filter(function(y){ return y.id === id; })[0]; return x ? x.ja : id; }).concat(S.seat ? ["席:" + ((SEATS.filter(function(y){ return y.id === S.seat; })[0] || {}).ja || S.seat)] : []).join("、")
};
S.lastSent = text;
S.sent = true; build();
try { window.scrollTo(0, root.getBoundingClientRect().top + window.pageYOffset - 8); } catch (e) {}
post(S.payload);
}
build();
})();
</script>
